name: iOS Build

on:
  push:
    branches: [ main, optimization ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS (Simulator — no code sign required)
        working-directory: frontend
        run: flutter build ios --simulator --debug

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r frontend/build/ios/iphonesimulator/Runner.app Payload/
          zip -r NutriSense-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriSense-iOS-Build
          path: NutriSense-iOS.ipa
