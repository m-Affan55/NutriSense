name: iOS Build

on:
  push:
    branches: [ main, optimization ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Install CocoaPods Pods
        working-directory: frontend/ios
        run: pod install

      - name: Build iOS App (No Code Sign)
        working-directory: frontend
        run: flutter build ios --no-codesign --release

      - name: Compress iOS Output
        run: |
          cd frontend/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r NutriSense-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriSense-iOS-Build
          path: frontend/build/ios/iphoneos/NutriSense-iOS.ipa
