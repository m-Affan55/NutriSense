workflows:
  ios-workflow:
    name: NutriSense iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.nutrisense.app
      vars:
        XCODE_WORKSPACE: "frontend/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          cd frontend
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install

      - name: Flutter build iOS
        script: |
          cd frontend
          flutter build ios --release --no-codesign

      - name: Build iOS IPA via Xcode
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@gmail.com  # Replace with your actual email
        notify:
          success: true
          failure: true
